<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follower-Ziel – TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#140a2b;--violet:#8b5cf6;--magenta:#ff2fd1;--cyan:#38d8ff;--sunset:#ff7a59;--ink:#f7ecff;--muted:#bda9df}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'Rajdhani','Barlow Condensed',sans-serif;color:var(--ink)}
.goal{position:relative;width:92vw;padding:2.2vw 3.4vw 2.8vw;transform:skewX(-8deg);border-radius:1.2vw;
 background:linear-gradient(180deg,rgba(32,12,66,.93),rgba(14,6,32,.93));
 border:.25vw solid rgba(255,47,209,.9);
 box-shadow:0 0 1.4vw rgba(255,47,209,.5),inset 0 0 2.4vw rgba(139,92,246,.28)}
.goal::after{content:'';position:absolute;left:6%;right:6%;bottom:-.25vw;height:.25vw;border-radius:1vw;
 background:linear-gradient(90deg,transparent,var(--sunset),var(--magenta),var(--cyan),transparent);filter:blur(.05vw)}
.inner{transform:skewX(8deg)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw}
.title{font-weight:700;font-size:3vw;letter-spacing:.03em;color:var(--cyan);text-shadow:0 0 .8vw rgba(56,216,255,.75);white-space:nowrap}
.count{font-family:'Permanent Marker',cursive;font-size:6vw;line-height:1;color:#fff;white-space:nowrap;
 text-shadow:0 0 .35vw var(--magenta),0 0 1.3vw var(--magenta),0 0 3vw rgba(255,47,209,.55)}
.count .of{font-size:3.2vw;margin-left:.8vw;color:var(--cyan);text-shadow:0 0 1vw rgba(56,216,255,.75)}
.track{position:relative;height:2.6vw;margin-top:1.6vw;border-radius:2vw;background:rgba(8,3,20,.95);
 box-shadow:inset 0 0 0 .18vw rgba(56,216,255,.55),0 0 1vw rgba(56,216,255,.22)}
.fill,.mirror{position:absolute;left:.35vw;width:0;border-radius:2vw;
 background:linear-gradient(90deg,var(--sunset),var(--magenta) 55%,var(--violet));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.fill{top:.35vw;bottom:.35vw;box-shadow:0 0 1.2vw rgba(255,47,209,.8)}
.fill::after{content:'';position:absolute;right:-.9vw;top:50%;width:1.8vw;height:1.8vw;transform:translateY(-50%);border-radius:50%;
 background:radial-gradient(circle,#fff 0 28%,var(--magenta) 58%,transparent 72%)}
.fill.zero::after{display:none}
.mirror{top:calc(100% + .45vw);height:1.6vw;opacity:.35;filter:blur(.45vw);
 -webkit-mask-image:linear-gradient(to bottom,#000,transparent);mask-image:linear-gradient(to bottom,#000,transparent)}
.foot{display:flex;justify-content:space-between;margin-top:2.3vw;font-size:2.4vw;font-weight:600;color:var(--muted)}
.foot .pct{color:var(--ink)}
.bump{animation:bump .6s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.done{animation:glow 2.4s ease-in-out infinite}
.done .title{color:#fff}
@keyframes glow{50%{border-color:var(--cyan);box-shadow:0 0 2.4vw rgba(56,216,255,.7),inset 0 0 2.4vw rgba(139,92,246,.35)}}
@media (prefers-reduced-motion:reduce){.fill,.mirror{transition:none}.bump,.done{animation:none}}
</style>
</head>
<body>
<div class="goal" id="goal"><div class="inner">
  <div class="head"><div class="title" id="title"></div><div class="count" id="count">0<span class="of" id="of"></span></div></div>
  <div class="track"><div class="fill zero" id="fill"></div><div class="mirror" id="mirror"></div></div>
  <div class="foot"><span id="status">Lade …</span><span class="pct" id="pct">0 %</span></div>
</div></div>
<script>
/* ===== EINSTELLUNGEN (oder per URL: ?aktuell=1234&ziel=1500&titel=Follower-Ziel) ===== */
const CONFIG={aktuell:0,ziel:1000,titel:'Follower-Ziel'};
/* ======================================================================================= */
const q=new URLSearchParams(location.search);
const goal=Math.max(1,parseInt(q.get('ziel'),10)||CONFIG.ziel);
const title=q.get('titel')||CONFIG.titel;
const start=Math.max(0,parseInt(q.get('aktuell'),10)||CONFIG.aktuell);

const fmt=n=>new Intl.NumberFormat('de-DE').format(n);
const $=id=>document.getElementById(id);
let shown=0,current=null,raf=0;
$('title').textContent=title;
$('of').textContent='/ '+fmt(goal);
function drawCount(n){$('count').firstChild.nodeValue=fmt(n);}
function animateTo(n){
  cancelAnimationFrame(raf);
  const from=shown,t0=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:1200;
  const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1;shown=Math.round(from+(n-from)*(1-Math.pow(1-k,3)));drawCount(shown);if(k<1)raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);
}
function update(n){
  if(current!==null&&n>current){const c=$('count');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');}
  current=n;animateTo(n);
  const p=Math.min(1,n/goal),w='calc((100% - .7vw) * '+p+')';
  $('fill').style.width=w;$('mirror').style.width=w;
  $('fill').classList.toggle('zero',p===0);
  $('pct').textContent=Math.floor(p*100)+' %';
  const done=n>=goal;
  $('goal').classList.toggle('done',done);
  $('status').textContent=done?'Ziel geschafft!':'Noch '+fmt(goal-n)+' bis zum Ziel';
}


update(start);
</script>
</body>
</html>
